openapi: 3.0.3
info:
  title: Conduwuit Admin API
  description: |
    Conduwuit 管理员 API 文档。

    Conduwuit 的管理操作通过向管理员房间发送特殊格式的 Matrix 消息来执行。
    所有管理命令以 `!admin` 为前缀，通过标准 Matrix Client-Server API 发送到管理员房间。

    **管理员房间:** `!MebIyXpRdL0lTTqNVT:localhost`

    **使用流程:**
    1. 使用管理员账户的 access_token 认证
    2. 向管理员房间发送 `m.room.message` 事件，body 为管理命令
    3. 从管理员房间读取服务器的响应消息
  version: 0.5.0
  contact:
    name: Mactirx 本地开发环境

servers:
  - url: http://localhost:6167
    description: 本地 Conduwuit homeserver

security:
  - bearerAuth: []

tags:
  - name: Admin Commands
    description: 通过 Matrix 消息发送管理命令
  - name: Appservices
    description: Application Service 管理
  - name: Rooms Management
    description: 房间管理
  - name: Users Management
    description: 用户管理
  - name: Server
    description: 服务器信息与操作
  - name: Federation
    description: 联邦测试与调试
  - name: Media Management
    description: 媒体管理

paths:
  # ============================================================
  # 管理命令 (通过 Matrix 消息)
  # ============================================================
  /_matrix/client/v3/rooms/{roomId}/send/m.room.message/{txnId}:
    put:
      tags: [Admin Commands]
      summary: 发送管理命令
      description: |
        向管理员房间发送管理命令。命令格式为 `!admin <子命令> [参数]`。

        管理员房间 ID: `!MebIyXpRdL0lTTqNVT:localhost`

        **常用命令列表:**
        - `!admin --help` — 显示所有可用命令
        - `!admin appservices list-registered` — 列出已注册的 appservice
        - `!admin appservices register` — 注册 appservice (附带 YAML)
        - `!admin appservices unregister <name>` — 注销 appservice
        - `!admin rooms list` — 列出房间
        - `!admin users list` — 列出用户
        - `!admin server info` — 服务器信息
      parameters:
        - name: roomId
          in: path
          required: true
          description: 管理员房间 ID
          schema:
            type: string
          example: "!MebIyXpRdL0lTTqNVT:localhost"
        - name: txnId
          in: path
          required: true
          description: 客户端事务 ID (唯一字符串，用于幂等)
          schema:
            type: string
          example: "admin_cmd_001"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCommandMessage'
            examples:
              help:
                summary: 显示帮助
                value:
                  msgtype: m.text
                  body: "!admin --help"
              list_appservices:
                summary: 列出已注册的 appservice
                value:
                  msgtype: m.text
                  body: "!admin appservices list-registered"
              register_appservice:
                summary: 注册 appservice
                description: |
                  注册一个 appservice。YAML 配置以代码块形式附在命令后面。
                value:
                  msgtype: m.text
                  body: "!admin appservices register\n```yaml\nid: mautrix-discord\nurl: http://localhost:29318\nas_token: as_token_value\nhs_token: hs_token_value\nsender_localpart: discordbot\nnamespaces:\n  users:\n    - regex: '@discord_.*:localhost'\n      exclusive: true\n  aliases:\n    - regex: '#discord_.*:localhost'\n      exclusive: true\n```"
              unregister_appservice:
                summary: 注销 appservice
                value:
                  msgtype: m.text
                  body: "!admin appservices unregister mautrix-discord"
              list_rooms:
                summary: 列出房间
                value:
                  msgtype: m.text
                  body: "!admin rooms list"
              list_users:
                summary: 列出用户
                value:
                  msgtype: m.text
                  body: "!admin users list"
              server_info:
                summary: 服务器信息
                value:
                  msgtype: m.text
                  body: "!admin server info"
      responses:
        '200':
          description: 命令已发送
          content:
            application/json:
              schema:
                type: object
                properties:
                  event_id:
                    type: string
                    description: 发送的事件 ID
              example:
                event_id: "$cmd_event:localhost"
        '403':
          description: 无管理员权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatrixError'
              example:
                errcode: M_FORBIDDEN
                error: You are not an admin

  /_matrix/client/v3/rooms/{roomId}/messages:
    get:
      tags: [Admin Commands]
      summary: 读取管理命令响应
      description: |
        从管理员房间获取消息，读取服务器对管理命令的响应。
        发送管理命令后，服务器会在管理员房间中回复执行结果。
      parameters:
        - name: roomId
          in: path
          required: true
          description: 管理员房间 ID
          schema:
            type: string
          example: "!MebIyXpRdL0lTTqNVT:localhost"
        - name: from
          in: query
          required: true
          description: 分页 token (从 /sync 获取)
          schema:
            type: string
        - name: dir
          in: query
          required: true
          description: 分页方向 (b=向后)
          schema:
            type: string
            enum: [b, f]
            default: b
        - name: limit
          in: query
          description: 返回的最大消息数
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: 消息列表 (包含管理命令响应)
          content:
            application/json:
              schema:
                type: object
                properties:
                  start:
                    type: string
                  end:
                    type: string
                  chunk:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminResponseEvent'
              example:
                start: "t47409-4357353_219380_26003_2265"
                end: "t47409-4357353_219380_26003_2260"
                chunk:
                  - event_id: "$response:localhost"
                    type: m.room.message
                    sender: "@conduit:localhost"
                    origin_server_ts: 1710000000000
                    content:
                      msgtype: m.notice
                      body: |
                        Registered appservices:
                        - mautrix-discord
                        - mautrix-telegram
                        - mautrix-whatsapp
                        - mautrix-signal
                        - mautrix-slack
                        - mautrix-gmessages

  /_matrix/client/v3/sync:
    get:
      tags: [Admin Commands]
      summary: 同步获取管理响应
      description: |
        也可以通过 /sync 端点来获取管理员房间的新消息。
        使用 filter 参数只获取管理员房间的事件。
      parameters:
        - name: since
          in: query
          description: 上次 /sync 的 next_batch
          schema:
            type: string
        - name: timeout
          in: query
          description: 长轮询超时 (毫秒)
          schema:
            type: integer
            default: 5000
        - name: filter
          in: query
          description: |
            JSON 过滤器，限定管理员房间。
            示例: `{"room":{"rooms":["!MebIyXpRdL0lTTqNVT:localhost"]}}`
          schema:
            type: string
      responses:
        '200':
          description: 同步响应
          content:
            application/json:
              schema:
                type: object
                properties:
                  next_batch:
                    type: string
                  rooms:
                    type: object

  # ============================================================
  # 用户管理命令 (详细)
  # ============================================================
  /_conduwuit/admin/v1/users:
    get:
      tags: [Users Management]
      summary: 列出所有用户
      description: 通过消息命令 `!admin users list` 也可执行。此为等效 REST 描述。
      responses:
        '200':
          description: 用户列表
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    user_id:
                      type: string
                    displayname:
                      type: string
                    is_admin:
                      type: boolean

  /_conduwuit/admin/v1/users/{userId}/deactivate:
    post:
      tags: [Users Management]
      summary: 停用用户
      description: |
        等效命令: `!admin users deactivate <user_id>`
        停用后用户无法登录，但数据保留。
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
          example: "@baduser:localhost"
      responses:
        '200':
          description: 停用成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  /_conduwuit/admin/v1/users/{userId}/reset_password:
    post:
      tags: [Users Management]
      summary: 重置用户密码
      description: |
        等效命令: `!admin users reset-password <user_id>`
        为指定用户设置新密码。
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
      responses:
        '200':
          description: 密码已重置
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  /_conduwuit/admin/v1/users/{userId}/make_admin:
    post:
      tags: [Users Management]
      summary: 设置/取消管理员权限
      description: |
        等效命令: `!admin users make-admin <user_id>` / `!admin users unmake-admin <user_id>`
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                admin:
                  type: boolean
                  default: true
      responses:
        '200':
          description: 权限已更改
          content:
            application/json:
              schema:
                type: object

  # ============================================================
  # 房间管理命令 (详细)
  # ============================================================
  /_conduwuit/admin/v1/rooms:
    get:
      tags: [Rooms Management]
      summary: 列出所有房间
      description: |
        等效命令: `!admin rooms list`
        返回服务器上所有房间。
      responses:
        '200':
          description: 房间列表
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    room_id:
                      type: string
                    name:
                      type: string
                    topic:
                      type: string
                    members:
                      type: integer
                    version:
                      type: string

  /_conduwuit/admin/v1/rooms/{roomId}/alias:
    get:
      tags: [Rooms Management]
      summary: 获取房间别名
      description: 等效命令: `!admin rooms alias list <room_id>`
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 别名列表
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /_conduwuit/admin/v1/rooms/{roomId}/directory:
    put:
      tags: [Rooms Management]
      summary: 设置房间公开目录可见性
      description: 等效命令: `!admin rooms directory publish <room_id>`
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                visibility:
                  type: string
                  enum: [public, private]
      responses:
        '200':
          description: 可见性已更新
          content:
            application/json:
              schema:
                type: object

  # ============================================================
  # Appservice 管理
  # ============================================================
  /_conduwuit/admin/v1/appservices:
    get:
      tags: [Appservices]
      summary: 列出已注册的 Appservice
      description: 等效命令: `!admin appservices list-registered`
      responses:
        '200':
          description: Appservice 列表
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    url:
                      type: string
                    sender_localpart:
                      type: string
              example:
                - id: mautrix-discord
                  url: "http://localhost:29318"
                  sender_localpart: discordbot
                - id: mautrix-telegram
                  url: "http://localhost:29317"
                  sender_localpart: telegrambot

  /_conduwuit/admin/v1/appservices/register:
    post:
      tags: [Appservices]
      summary: 注册 Appservice
      description: |
        等效命令: `!admin appservices register` + YAML 代码块。
        上传 appservice registration YAML 进行注册。
      requestBody:
        required: true
        content:
          application/yaml:
            schema:
              type: string
            example: |
              id: mautrix-discord
              url: http://localhost:29318
              as_token: as_token_value
              hs_token: hs_token_value
              sender_localpart: discordbot
              namespaces:
                users:
                  - regex: '@discord_.*:localhost'
                    exclusive: true
      responses:
        '200':
          description: 注册成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  /_conduwuit/admin/v1/appservices/{appserviceId}:
    delete:
      tags: [Appservices]
      summary: 注销 Appservice
      description: 等效命令: `!admin appservices unregister <name>`
      parameters:
        - name: appserviceId
          in: path
          required: true
          schema:
            type: string
          example: mautrix-discord
      responses:
        '200':
          description: 注销成功
          content:
            application/json:
              schema:
                type: object

  # ============================================================
  # 服务器信息与操作
  # ============================================================
  /_conduwuit/admin/v1/server/info:
    get:
      tags: [Server]
      summary: 获取服务器信息
      description: 等效命令: `!admin server info`
      responses:
        '200':
          description: 服务器信息
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  version:
                    type: string
                  database_backend:
                    type: string
                  total_users:
                    type: integer
                  total_rooms:
                    type: integer
              example:
                name: Conduwuit
                version: "0.5.0"
                database_backend: RocksDB
                total_users: 12
                total_rooms: 35

  /_conduwuit/admin/v1/server/memory_usage:
    get:
      tags: [Server]
      summary: 获取内存使用情况
      description: 等效命令: `!admin server memory-usage`
      responses:
        '200':
          description: 内存信息
          content:
            application/json:
              schema:
                type: object
                properties:
                  resident_set_size:
                    type: integer
                    description: RSS (字节)
                  database_cache_size:
                    type: integer

  /_conduwuit/admin/v1/server/uptime:
    get:
      tags: [Server]
      summary: 获取运行时间
      description: 等效命令: `!admin server uptime`
      responses:
        '200':
          description: 运行时间
          content:
            application/json:
              schema:
                type: object
                properties:
                  uptime_seconds:
                    type: integer

  # ============================================================
  # 联邦调试
  # ============================================================
  /_conduwuit/admin/v1/federation/ping:
    post:
      tags: [Federation]
      summary: Ping 远程服务器
      description: |
        等效命令: `!admin federation ping <server_name>`
        测试与远程 homeserver 的联邦连接。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [server_name]
              properties:
                server_name:
                  type: string
            example:
              server_name: "matrix.org"
      responses:
        '200':
          description: Ping 结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  latency_ms:
                    type: integer
                  reachable:
                    type: boolean

  /_conduwuit/admin/v1/federation/signing_keys/{serverName}:
    get:
      tags: [Federation]
      summary: 获取远程服务器签名密钥
      description: 等效命令: `!admin federation signing-keys <server_name>`
      parameters:
        - name: serverName
          in: path
          required: true
          schema:
            type: string
          example: "matrix.org"
      responses:
        '200':
          description: 签名密钥
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  # ============================================================
  # 媒体管理
  # ============================================================
  /_conduwuit/admin/v1/media/purge:
    post:
      tags: [Media Management]
      summary: 清理旧媒体
      description: |
        等效命令: `!admin media purge <days>`
        删除超过指定天数未访问的缓存远程媒体。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                older_than_days:
                  type: integer
                  default: 30
      responses:
        '200':
          description: 清理完成
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted_count:
                    type: integer

  /_conduwuit/admin/v1/media/delete/{mxcUrl}:
    delete:
      tags: [Media Management]
      summary: 删除指定媒体
      description: 删除指定 mxc:// URI 对应的媒体文件。
      parameters:
        - name: mxcUrl
          in: path
          required: true
          description: "mxc URL (URL-encoded, 例如 mxc%3A%2F%2Flocalhost%2Fabc123)"
          schema:
            type: string
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                type: object

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        管理员用户的 access_token。
        管理员 token: `C2seZDqk1OrBIjnMizBIyJnLv5xmPxRf`
        格式: `Authorization: Bearer C2seZDqk1OrBIjnMizBIyJnLv5xmPxRf`

  schemas:
    AdminCommandMessage:
      type: object
      required: [msgtype, body]
      properties:
        msgtype:
          type: string
          enum: [m.text]
          description: 消息类型，固定为 m.text
        body:
          type: string
          description: |
            管理命令文本。必须以 `!admin` 开头。

            **Appservice 命令:**
            - `!admin appservices register` + YAML 代码块
            - `!admin appservices unregister <name>`
            - `!admin appservices list-registered`

            **房间命令:**
            - `!admin rooms list`
            - `!admin rooms alias list <room_id>` — 列出房间别名
            - `!admin rooms alias set <room_alias> <room_id>` — 设置别名
            - `!admin rooms alias remove <room_alias>` — 删除别名
            - `!admin rooms directory publish <room_id>` — 公开房间
            - `!admin rooms directory unpublish <room_id>` — 取消公开

            **用户命令:**
            - `!admin users list`
            - `!admin users create <localpart> <password>` — 创建用户
            - `!admin users deactivate <user_id>` — 停用用户
            - `!admin users reset-password <user_id>` — 重置密码
            - `!admin users make-admin <user_id>` — 授予管理员权限
            - `!admin users unmake-admin <user_id>` — 撤销管理员权限

            **服务器命令:**
            - `!admin server info` — 服务器信息
            - `!admin server uptime` — 运行时间
            - `!admin server memory-usage` — 内存使用
            - `!admin server clear-caches` — 清除缓存

            **联邦命令:**
            - `!admin federation ping <server_name>` — 测试联邦连接
            - `!admin federation signing-keys <server_name>` — 获取签名密钥
            - `!admin federation disable <server_name>` — 禁用联邦
            - `!admin federation enable <server_name>` — 启用联邦

            **媒体命令:**
            - `!admin media purge <days>` — 清理超过 N 天的远程媒体
            - `!admin media delete <mxc_url>` — 删除指定媒体

            **帮助:**
            - `!admin --help`
            - `!admin <子命令> --help`

    AdminResponseEvent:
      type: object
      properties:
        event_id:
          type: string
        type:
          type: string
          enum: [m.room.message]
        sender:
          type: string
          description: 服务器 bot 用户 (如 @conduit:localhost)
        origin_server_ts:
          type: integer
          format: int64
        content:
          type: object
          properties:
            msgtype:
              type: string
              enum: [m.notice]
              description: 服务器响应使用 m.notice 类型
            body:
              type: string
              description: 命令执行结果文本

    MatrixError:
      type: object
      required: [errcode, error]
      properties:
        errcode:
          type: string
        error:
          type: string
